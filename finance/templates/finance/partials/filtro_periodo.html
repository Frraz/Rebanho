{% load number_filters %}
<div class="sm:col-span-2">
    <label class="block text-xs font-medium text-gray-700 mb-1.5">Mês</label>
    <select name="mes"
            class="block w-full border border-gray-300 rounded-xl py-2.5 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
        <option value="">Todos</option>
        {% for val, label in meses %}
        <option value="{{ val }}" {% if val == mes_filtro %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>

<div class="sm:col-span-2">
    <label class="block text-xs font-medium text-gray-700 mb-1.5">Ano</label>
    <select name="ano"
            class="block w-full border border-gray-300 rounded-xl py-2.5 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
        <option value="">Todos</option>
        {% for ano in anos %}
        <option value="{{ ano|stringformat:'d' }}" {% if ano|stringformat:'s' == ano_filtro %}selected{% endif %}>{{ ano|year_fmt }}</option>
        {% endfor %}
    </select>
</div>
